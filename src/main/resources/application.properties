# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unify}
quarkus.datasource.username=${DB_USER:admin}
quarkus.datasource.password=${DB_PASSWORD:admin}


quarkus.http.host=0.0.0.0

# Hibernate
# Em prod/homolog o Hibernate apenas VALIDA. Quem cria e altera schema e o Flyway.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Permite adotar Flyway sobre um banco que ja tem tabelas (primeira execucao).
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# --- Dev: iteracao rapida, schema descartavel, seed completo ---
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=import.sql,import-dev.sql,import-users.sql
%dev.quarkus.flyway.migrate-at-start=false

# --- Test ---
%test.quarkus.hibernate-orm.database.generation=drop-and-create
# Inerte quando o CI sobrescreve via -Dquarkus.hibernate-orm.database.generation=validate
# (fluxo Flyway-only do pipeline): o Hibernate so roda o sql-load-script quando
# ele proprio cria o schema (drop-and-create), entao em CI quem semeia dados e o
# Flyway (db/migration), nao este script.
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.flyway.migrate-at-start=false

# JWT
# As chaves NUNCA sao empacotadas. Caminhos vem do ambiente.
# Formatos aceitos: file:/caminho/absoluto.pem  |  file:./secrets/chave.pem
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/publicKey.pem}
mp.jwt.verify.issuer=https://unify.com.br
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:file:./secrets/privateKey.pem}
smallrye.jwt.new-token.issuer=https://unify.com.br

# Token config
unify.jwt.access-token.expiration-minutes=60
unify.jwt.refresh-token.expiration-days=30

# CORS
# A API e stateless (JWT no header Authorization). Nao usamos cookies,
# portanto allow-credentials fica DESLIGADO e nenhuma origem curinga e aceita.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.exposed-headers=ETag
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=false

# Em dev, lista explicita e enxuta - nunca /.*/
%dev.quarkus.http.cors.origins=http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://10.0.2.2:8081

# Limites HTTP
# Corpo maximo de qualquer requisicao (protege contra DoS por upload).
quarkus.http.limits.max-body-size=10M
quarkus.http.limits.max-form-attribute-size=64K
quarkus.http.limits.max-header-size=20K
# Uploads sao gravados em disco temporario, nao em memoria.
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.delete-uploaded-files-on-end=true

# Limite de imagem por arquivo, validado na camada de recurso.
unify.upload.image.max-bytes=5242880

# Rate limiting (endpoints de autenticacao)
unify.rate-limit.enabled=true
unify.rate-limit.max-requests=10
unify.rate-limit.window-seconds=60
# Desligado em teste automatizado para nao gerar flakiness.
%test.unify.rate-limit.enabled=false

# Mailtrap / Mailer config
quarkus.mailer.host=${MAILTRAP_HOST:localhost}
quarkus.mailer.port=${MAILTRAP_PORT:2525}
quarkus.mailer.username=${MAILTRAP_USERNAME:test}
quarkus.mailer.password=${MAILTRAP_PASSWORD:test}
quarkus.mailer.from=${MAILTRAP_FROM:test@unify.local}
quarkus.mailer.tls=false
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.login=REQUIRED

# Envio real fora de dev/test. Em dev os e-mails so aparecem no log.
quarkus.mailer.mock=false
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true

# Email verification config
unify.mail.verification.expiration-hours=3

# Password reset config
unify.mail.password-reset.expiration-hours=1
unify.frontend.password-reset-url=${FRONTEND_PASSWORD_RESET_URL:http://localhost:8081/reset-password}

# ---- Algoritmo de match: fallbacks ----
unify.match.default-max-distance-km=60
unify.match.default-min-age=18
unify.match.default-max-age=99
unify.match.allow-discovery-without-location=true
unify.match.no-location-candidate-quota=0.15
unify.match.decline-cooldown-days=30

# Evita ~1.750 queries por chamada de discovery (250 perfis x 6 colecoes @ManyToMany LAZY).
quarkus.hibernate-orm.fetch.batch-size=50

# ---- Chat ----
unify.chat.message.max-length=4000
unify.chat.audio.max-size-bytes=5242880
unify.chat.audio.max-duration-seconds=120
unify.chat.image.max-size-bytes=8388608

# TEMP-DEBUG
%dev.quarkus.http.access-log.enabled=true
%dev.quarkus.http.access-log.pattern=%h %r %s %b %{i,Authorization}
